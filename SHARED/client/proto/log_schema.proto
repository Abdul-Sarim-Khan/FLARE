// FLARE — Federated Log Analysis and Response Engine
// Proto schema v0.4  |  Flare-Final-V2
//
// Message flow:
//
//   Agent ──[AlertBatch]──► Server          host: rule engine detections
//                                           network: MLP inference
//   Agent ──[Heartbeat]───► Server          every 60s, liveness + model version
//   Agent ──[FLUpdate]────► Server          network track only, after local training
//   Server ──[ModelUpdate]► Agent           server pushes FedAvg global model
//
// Wire framing (all transports):
//   [4-byte big-endian uint32 = N][N bytes serialized protobuf]
//   A single HTTP POST body may contain multiple framed messages concatenated.
//
// HTTP endpoints (all require X-Auth-Token header):
//   POST /api/alerts/ingest     body: framed AlertBatch(es)
//   POST /api/heartbeat         body: framed Heartbeat
//   POST /api/fl/update         body: framed FLUpdate  (network track only)
//   GET  /api/fl/model/:track   response: framed ModelUpdate
//
// Track behaviour:
//   HOST    — Windows event log rule engine. Deterministic rules + IOC matching.
//             Fields rule_id, mitre_id, mitre_tactic, suggestion, risk_note
//             are always populated. top3 is always empty.
//   NETWORK — CICIDS flow MLP (binary: ATTACK / BENIGN).
//             Fields top3 are empty (binary classifier).
//             rule_id / mitre_id / suggestion populated by server enrichment layer.

syntax = "proto3";
package flare;

// ─────────────────────────────────────────────────────────────────────────────
// Shared enums
// ─────────────────────────────────────────────────────────────────────────────

enum Severity {
  SEVERITY_UNKNOWN  = 0;
  SEVERITY_LOW      = 1;  // confidence >= 0.70  /  rule tier: informational
  SEVERITY_MEDIUM   = 2;  // confidence >= 0.75  /  rule tier: suspicious
  SEVERITY_HIGH     = 3;  // confidence >= 0.85  /  rule tier: likely malicious
  SEVERITY_CRITICAL = 4;  // confidence >= 0.95  /  rule tier: confirmed TTP
}

enum Track {
  TRACK_UNKNOWN = 0;
  TRACK_HOST    = 1;  // Windows event log — rule engine + IOC matching
  TRACK_NETWORK = 2;  // CICIDS flow MLP — binary attack/benign classifier
}

// ─────────────────────────────────────────────────────────────────────────────
// AlertEvent  —  one detection from either the rule engine or network MLP
// ─────────────────────────────────────────────────────────────────────────────

// Runner-up prediction — only used for future multi-class network models.
// Empty in v0.4 for both tracks (host is rule-based, network is binary).
message Prediction {
  string label      = 1;
  float  confidence = 2;
}

message AlertEvent {
  // ── Identity ──────────────────────────────────────────────────────────────
  string alert_id  = 1;  // uuid4  — deduplication key on server
  string timestamp = 2;  // ISO-8601 UTC at moment of detection
  string client_id = 3;  // COMPUTERNAME of the reporting agent
  string client_ip = 4;  // agent LAN IPv4

  // ── Classification ────────────────────────────────────────────────────────
  Severity severity    = 5;
  Track    track       = 6;

  // Human-readable attack name.
  // Host:    "Kerberoasting via RC4 Downgrade"
  // Network: "Network Attack Detected"
  string   attack_type = 7;

  // Confidence score 0.0-1.0.
  // Host:    rule confidence (1.0 = deterministic exact match, 0.7-0.9 = threshold rule)
  // Network: raw MLP output probability
  float    confidence  = 8;

  // ── Detection window ──────────────────────────────────────────────────────
  string window_start = 9;   // ISO-8601 UTC
  string window_end   = 10;  // ISO-8601 UTC
  int32  event_count  = 11;  // events (host) or flows (network) in window

  // Runner-up predictions. Reserved for future use, empty in v0.4.
  repeated Prediction top3 = 12;

  // ── Evidence ──────────────────────────────────────────────────────────────
  // JSON-encoded key-value pairs of the raw evidence that triggered detection.
  //
  // Host rule example:
  //   {"event_id": "4769", "encryption_type": "0x17",
  //    "service_name": "MSSQLSvc/db.corp.local",
  //    "requested_by": "jsmith", "src_ip": "192.168.1.45"}
  //
  // Network MLP example:
  //   {"BwdPacketLenStd": 1842.3, "AveragePacketSize": 924.1,
  //    "DestinationPort": 4444, "FlowBytesPerSec": 98234.5}
  string evidence = 13;

  // ── Rule-based enrichment (host track) ────────────────────────────────────
  // Machine-readable rule identifier. Used for:
  //   - Dashboard histogram: "how many times has THIS rule fired on this machine"
  //   - Suppression rules: silence rule X on client Y after N false positives
  //   - Log fetch: server knows which event IDs to request from agent
  // Examples: "kerberoasting_rc4", "ps_download_cradle", "new_service_temp_path"
  // Empty for network track.
  string rule_id = 14;

  // MITRE ATT&CK technique ID.
  // Examples: "T1558.003" (Kerberoasting), "T1059.001" (PowerShell)
  // Empty for network track in v0.4.
  string mitre_id = 15;

  // MITRE ATT&CK tactic name (human readable).
  // Examples: "Credential Access", "Execution", "Persistence"
  string mitre_tactic = 16;

  // Analyst recommendation — what to do right now.
  // Example: "Audit SPNs on service accounts. Rotate Kerberos keys.
  //           Check for offline cracking tools on 192.168.1.45."
  string suggestion = 17;

  // Risk context — why this matters in plain language.
  // Example: "RC4 Kerberos tickets can be cracked offline in minutes with
  //           Hashcat. If cracked, attacker gains service account credentials
  //           without touching the domain controller again."
  string risk_note = 18;

  // The raw log (e.g. XML) that triggered this alert
  string raw_log = 19;
}

// Batch wrapper — one POST carries N alerts to reduce round-trips.
message AlertBatch {
  repeated AlertEvent alerts = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Heartbeat  —  liveness ping + status report
// ─────────────────────────────────────────────────────────────────────────────
// Sent every 60s. Server marks client offline after 3 missed heartbeats.

message Heartbeat {
  string client_id      = 1;
  string timestamp      = 2;
  string client_ip      = 3;
  string agent_version  = 4;  // semver e.g. "3.0.0"

  // host_model_hash is unused in Flare-Final-V2 (no host ML model).
  // Kept for wire compatibility. Always empty string on host track.
  string host_model_hash = 5;

  // SHA256 (first 8 hex chars) of network_mlp.pkl.
  // Server can detect stale network models.
  string net_model_hash  = 6;

  int32  uptime_seconds  = 7;

  // Track health flags.
  // host_track_ok = false  →  event log unreadable (privilege issue)
  // net_track_ok  = false  →  pktmon unavailable or capture failed
  bool   host_track_ok   = 8;
  bool   net_track_ok    = 9;

  // Running alert totals since agent start.
  int32  host_alerts_total = 10;
  int32  net_alerts_total  = 11;

  // Rule engine stats — host track only.
  // How many IOC matches vs rule-threshold matches since start.
  int32  ioc_matches_total  = 12;
  int32  rule_hits_total    = 13;
}

// ─────────────────────────────────────────────────────────────────────────────
// Federated Learning  —  network track only in Flare-Final-V2
// ─────────────────────────────────────────────────────────────────────────────
//
// Timing:
//   Test mode  (FLARE_FL_TEST_MODE=1): retrain + submit every 5 min, poll every 2 min
//   Production (FLARE_FL_TEST_MODE=0): retrain + submit every 24h,  poll every 6h
//
// FedAvg protocol:
//   1. Server broadcasts current global model via ModelUpdate.
//   2. Agent fine-tunes locally on captured flow feature vectors.
//   3. Agent sends FLUpdate with updated weights + sample count.
//   4. Server waits for min_clients updates (test: 2, prod: 3),
//      runs FedAvg, bumps round, broadcasts new ModelUpdate.
//
// Weight layout for MLP (input → H1 → H2 → output):
//   coefs[0]      : (n_input, H1)   flattened row-major
//   coefs[1]      : (H1, H2)
//   coefs[2]      : (H2, n_out)
//   intercepts[0] : (H1,)
//   intercepts[1] : (H2,)
//   intercepts[2] : (n_out,)

message LayerWeights {
  repeated float values = 1 [packed = true];  // flattened row-major
  int32          rows   = 2;
  int32          cols   = 3;  // 0 for bias/intercept vectors
}

// Agent → Server after local network model fine-tuning.
message FLUpdate {
  string timestamp    = 1;
  string client_id    = 2;
  Track  track        = 3;  // always TRACK_NETWORK in Flare-Final-V2

  // Rows of flow feature data used for this training run.
  // FedAvg weight: w_k = n_k / sum(n_i)
  int32  sample_count = 4;

  // Global model version this update is based on.
  // Server rejects updates older than (current_round - 1).
  int32  base_round   = 5;

  // Full updated weights after local fine-tuning.
  repeated LayerWeights coefs      = 6;
  repeated LayerWeights intercepts = 7;

  // Local training loss — server tracks convergence across rounds.
  float  local_loss   = 8;
}

// Server → Agent after each FedAvg round.
message ModelUpdate {
  string timestamp    = 1;
  Track  track        = 2;
  string version      = 3;  // semver bumped each round e.g. "3.0.1"
  int32  round        = 4;  // monotonically increasing FL round counter
  int32  client_count = 5;  // clients that contributed to this round

  // Averaged global weights ready to load into agent's sklearn MLP.
  repeated LayerWeights coefs      = 6;
  repeated LayerWeights intercepts = 7;

  // Scaler parameters synced alongside model weights.
  repeated float scaler_mean  = 8 [packed = true];
  repeated float scaler_scale = 9 [packed = true];
}
