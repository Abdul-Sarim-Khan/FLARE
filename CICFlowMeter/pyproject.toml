[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cicflowmeter-py"
version = "1.0.0"
description = "Python port of CICFlowMeter — CICIDS2017-compatible flow feature extractor"
requires-python = ">=3.9"
dependencies = [
    "scapy>=2.5.0",
]

[project.scripts]
cicflowmeter = "cicflowmeter_py.cli:main"

[tool.setuptools.packages.find]
include = ["cicflowmeter_py*"]
